name: Amyris
description: 'Amyris, Inc. is a synthetic-biology and precision-fermentation company
  that engineers microbes to convert plant-derived sugars into high-performance renewable
  molecules — including farnesene, squalene, squalane, and bisabolol — at industrial
  scale. The company offers strain development, process development, piloting, scale-up,
  and manufacturing services for custom renewable chemistry used across personal care,
  cosmetics, flavors and fragrances, and other industries, emphasizing resilient supply
  chains, product consistency, and reduced ecological impact. Amyris is a private company
  that emerged from a 2023 Chapter 11 restructuring; it does not currently publish a
  public developer API or technology platform.'
